[package]
name = "crypto-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chacha20poly1305 = "0.11.0"

x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

hkdf = "0.13.0"
sha2 = "0.11.0"
ed25519-dalek = "2.1.1"
zeroize = "1.8.1"

bytes = "1.6"

getrandom = { version = "0.2", features = ["js"] }

wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }