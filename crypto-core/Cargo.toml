[package]
name = "crypto-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chacha20poly1305 = "0.10"

x25519-dalek = { version = "2.0", features = ["static_secrets"] }

hkdf = "0.12"
sha2 = "0.10"


bytes = "1.6"

getrandom = { version = "0.2", features = ["js"] }

wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }